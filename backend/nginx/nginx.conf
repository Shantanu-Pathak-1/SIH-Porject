# ==============================================================================
# GeoAlert-NER — Production Nginx Reverse Proxy Configuration Template
# Architecture: Internet -> Nginx (:80/:443) -> Frontend SPA (Static Files)
#                                            -> FastAPI Backend (http://api:8000)
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─── Logging Configuration ────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ─── Performance & Buffer Tuning ──────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Maximum allowed payload (supports field incident photos & batch telemetry)
    client_max_body_size 25M;

    # ─── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ─── Upstream API Service Definition ──────────────────────────────────────
    upstream backend_api {
        # Container service name defined in docker-compose.yml
        server api:8000;
        keepalive 32;
    }

    # ─── Production Server Block ──────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;

        # Replace with your production domain name or server IP address
        # Example: server_name geoalert.ner.gov.in;
        server_name YOUR_DOMAIN_OR_SERVER_IP;

        # Optional HTTPS redirect (uncomment when SSL certificates are provisioned)
        # return 301 https://$host$request_uri;

        # ─── Frontend React/Vite SPA Static Files ─────────────────────────────
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;

            # Static asset caching headers
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
            }
        }

        # ─── FastAPI API Endpoints & Realtime Reverse Proxy ───────────────────
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # WebSocket upgrade support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Proxy timeouts (allows for batch telemetry and spatial analytics)
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Server-Sent Events (SSE) & streaming support
            # CRITICAL: Disable buffering to permit real-time alert event delivery
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # ─── Health Check Endpoint Proxy ──────────────────────────────────────
        location = /health {
            proxy_pass http://backend_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # ─── Interactive Documentation (Swagger / ReDoc / OpenAPI) ────────────
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── Security Headers ─────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
