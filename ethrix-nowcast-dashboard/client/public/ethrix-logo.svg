<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Emerald-Teal Primary Gradient -->
    <linearGradient id="ethrix-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Pulse Gradient -->
    <linearGradient id="ethrix-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Lightning Gold Gradient -->
    <linearGradient id="ethrix-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="ethrix-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Tech Shield Outer Contour (Transparent background) -->
  <polygon
    points="50,6 88,27 88,73 50,94 12,73 12,27"
    fill="url(#ethrix-emerald)"
    fill-opacity="0.12"
    stroke="url(#ethrix-emerald)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Concentric Doppler Radar Arcs -->
  <path
    d="M26,38 A28,28 0 0,1 74,38"
    fill="none"
    stroke="url(#ethrix-cyan)"
    stroke-width="2"
    stroke-dasharray="3,4"
    stroke-linecap="round"
    opacity="0.75"
  />
  <path
    d="M33,45 A19,19 0 0,1 67,45"
    fill="none"
    stroke="url(#ethrix-cyan)"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.9"
  />

  <!-- Himalayan Mountain Peak Silhouette (Topography Base) -->
  <path
    d="M22,70 L38,50 L48,60 L62,42 L78,70 Z"
    fill="url(#ethrix-emerald)"
    fill-opacity="0.3"
    stroke="url(#ethrix-emerald)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Inner Mountain Ridge Line -->
  <path
    d="M38,50 L42,70 M62,42 L60,70"
    stroke="url(#ethrix-cyan)"
    stroke-width="1.2"
    stroke-opacity="0.5"
    stroke-linecap="round"
  />

  <!-- Stylized Cloudburst Convective Cloud Formation -->
  <path
    d="M30,50 C26,50 22,46 22,41 C22,36 26,33 30,33 C31,27 36,22 43,22 C49,22 54,26 56,31 C59,29 64,30 66,33 C71,34 74,38 74,43 C74,48 70,51 65,51 Z"
    fill="url(#ethrix-cyan)"
    fill-opacity="0.22"
    stroke="url(#ethrix-cyan)"
    stroke-width="1.8"
    stroke-linejoin="round"
  />

  <!-- Dramatic Electric Lightning Bolt (Centerpiece) -->
  <polygon
    points="53,16 37,47 48,47 43,76 65,42 53,42"
    fill="url(#ethrix-gold)"
    stroke="#fff"
    stroke-width="1"
    filter="url(#ethrix-glow)"
  />

  <!-- Radiating Sensor/Warning Core Node -->
  <circle cx="50" cy="94" r="3" fill="#10b981" />
  <circle cx="50" cy="6" r="3" fill="#38bdf8" />
  <circle cx="88" cy="27" r="2.5" fill="#f59e0b" />
  <circle cx="12" cy="27" r="2.5" fill="#f59e0b" />
</svg>
